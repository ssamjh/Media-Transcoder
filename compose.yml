services:
  transcoder:
    container_name: transcoder
    build: .
    image: transcoder:latest
    restart: unless-stopped
    user: "1000:1000"
    ports:
      # The panel has no authentication and can start encodes and rewrite the
      # config, so bind it to a trusted network only.
      - 8080:8080
    environment:
      - TZ=Pacific/Auckland
      - TRANSCODER_CONFIG=/config/config.toml
      - LOG_LEVEL=info
    volumes:
      - ./config:/config
      - /mnt/nfs/media:/media
      # Encodes are written here first and only moved onto the library once
      # they verify, so this wants to be local disk, not a network share.
      - /mnt/Downloads/Transcode-Temp:/temp
    cpus: 24
    mem_limit: 8g
